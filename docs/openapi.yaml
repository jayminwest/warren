      summary: GET /whoami
      responses:
        '200':
          description: Successful response.
        default:
          description: Error response (see `src/core/errors.ts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: 'warren-e195: `readPublic`, not `anonymous` — an exempt route gets no actor to name.'
