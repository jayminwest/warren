      summary: GET /runs/:id/finalize-intent
      responses:
        '200':
          description: Successful response.
        default:
          description: Error response (see `src/core/errors.ts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: >-
        warren-0d35: the in-pod finalize callback for the K8s backend — the pod fetches the reap
        intent, runs the workspace-dependent half in place, and POSTs the FinalizeResult back.
        Bearer-gated; the pod carries its per-run scoped token (warren-57fd).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /runs/{id}/finalize-result:
    post:
      operationId: postRunFinalizeResultHandler
      tags:
        - runs
      summary: POST /runs/:id/finalize-result
      responses:
        '200':
          description: Successful response.
        default:
          description: Error response (see `src/core/errors.ts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /runs/{id}/git-credential:
    post:
      operationId: postRunGitCredentialHandler
      tags:
        - runs
      summary: POST /runs/:id/git-credential
      responses:
        '200':
          description: Successful response.
        default:
          description: Error response (see `src/core/errors.ts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: >-
        warren-c9ac: the in-pod credential re-mint (forge-contract.md §4.1 window 3) — the pod
        requests a freshly-minted push credential over the same authenticated callback channel
        instead of trusting the mounted Secret.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /runs/{id}/inbox:
    get:
      operationId: pollRunInboxHandler
      tags:
        - runs
      summary: GET /runs/:id/inbox
      responses:
        '200':
          description: Successful response.
        default:
          description: Error response (see `src/core/errors.ts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: >-
        warren-3d0b: the in-pod steering poll for the K8s backend. Bearer-gated like every /runs
        route; the pod carries its per-run SCOPED token (warren-57fd). Destructive on read (it
        claims unread messages), so for a non-run caller it is operator-only (warren-b875).
        `?peek=1` lists the unread queue WITHOUT claiming (warren-3305) — the only safe way for an
        operator or the UI to inspect it; a bare poll steals the message from the pod's steering
        poll.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /runs/{id}/preview/login:
    post:
      operationId: previewLoginHandler
      tags:
        - runs
      summary: POST /runs/:id/preview/login
      responses:
        '200':
          description: Successful response.
        default:
          description: Error response (see `src/core/errors.ts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: >-
        warren-e1b0: POST, not GET — the bearer rides the `Authorization` header like every other
        /runs route instead of a `?token=` query string that would land in history / Referer / proxy
        logs.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /runs/{id}/preview/teardown:
    post:
      operationId: previewTeardownHandler
      tags:
        - runs
      summary: POST /runs/:id/preview/teardown
      responses:
        '200':
          description: Successful response.
        default:
          description: Error response (see `src/core/errors.ts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /runs/{id}/salvage:
    post:
      operationId: postRunSalvageHandler
      tags:
        - runs
      summary: POST /runs/:id/salvage
      responses:
        '200':
          description: Successful response.
        default:
          description: Error response (see `src/core/errors.ts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: >-
        warren-cd3b: the in-pod salvage intake — the pod POSTs the work it captured (rescue ref +
        git bundle) when the finalize branch push failed or no reap intent ever arrived, BEFORE its
        emptyDir dies with the pod.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /runs/{id}/steer:
    post:
      operationId: steerRunHandler
      tags:
        - runs
      summary: POST /runs/:id/steer
