# SECRET TEMPLATE — PLACEHOLDER VALUES ONLY. Never commit real values here.
#
# Mirrors deploy/k8s/base/secrets.yaml: do NOT `kubectl apply` this file as-is.
# Create the real Secret imperatively (values never touch git):
#
#   kubectl -n warren create secret generic postgres-credentials \
#     --from-literal=postgres-user=warren \
#     --from-literal=postgres-password=... \
#     --from-literal=postgres-db=warren
#
# This stub exists so `kustomize build` of an overlay including the component
# resolves and so the key layout is documented in one place. The StatefulSet
# sources POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from it.
#
# DSN (warren-9f5a): point the control plane's `warren-secrets/warren-db-url`
# (base/secrets.yaml) at
#
#   postgres://warren:<pw>@postgres.warren.svc:5432/warren
#
# with NO sslmode flags — traffic never leaves the cluster network, so there is
# no TLS handshake to configure (§1.5).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: warren
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  postgres-user: "REPLACE_ME"
  postgres-password: "REPLACE_ME"
  postgres-db: "warren"
