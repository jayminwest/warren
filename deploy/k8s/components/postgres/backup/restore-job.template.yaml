# Restore Job TEMPLATE (warren-a413) — rendered into a throwaway Job, never
# applied as-is and deliberately absent from kustomization.yaml so no standing
# postgres-restore object exists (a Job's pod template is immutable, so
# `kubectl set env job/...` cannot parameterise one). It restores a named dump
# from $BACKUP_BUCKET_URL/$BACKUP_OBJECT_PREFIX/<dump-name> into the postgres
# Service with pg_restore --clean --if-exists --no-owner.
#
# ⚠️ Run against an IDLE warren only: --clean drops every object in the
# target database first, so a live control plane would lose in-flight rows.
# Scale the warren Deployment to zero first (RUNBOOK-K8S §7.6 drain), then
# restore, then scale back up.
#
# Same two-container split as the CronJob: google/cloud-sdk:slim fetches the
# dump onto an emptyDir, postgres:17 runs pg_restore against postgres.warren.svc.
#
# Render (dump name WITHOUT the .dump suffix; RESTORE_DUMP may itself be
# empty only if you enjoy a loud failure in the fetch container):
#
#   sed -e 's/__RESTORE_NAME__/postgres-restore-<date>/' \
#       -e 's/__RESTORE_DUMP__/<dump-name>/' \
#       deploy/k8s/components/postgres/backup/restore-job.template.yaml \
#     | kubectl -n warren create -f -
#   kubectl -n warren logs job/postgres-restore-<date> -c restore -f
#
# envsubst would work too, but sed ships everywhere (the operator
# workstation, a cloud-sdk pod, CI) with no extra image; envsubst is in
# gettext, which google/cloud-sdk:slim and most distroless bases omit.
#
# Cleanup when done: kubectl -n warren delete job postgres-restore-<date>
apiVersion: batch/v1
kind: Job
metadata:
  name: __RESTORE_NAME__
  namespace: warren
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: backup
spec:
  suspend: true # idle template — patch suspend=false to run (see header)
  backoffLimit: 0 # fail loudly on the first error
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: backup
    spec:
      restartPolicy: Never
      serviceAccountName: postgres-backup
      initContainers:
        - name: fetch
          image: google/cloud-sdk:slim
          command:
            - /bin/sh
            - -ec
            - |
              test -n "$RESTORE_DUMP" || { echo "set RESTORE_DUMP=<date> first"; exit 1; }
              gcloud storage cp \
                "$BACKUP_BUCKET_URL/$BACKUP_OBJECT_PREFIX/$RESTORE_DUMP.dump" \
                /dump/restore.dump
              ls -lh /dump/restore.dump
          env:
            - name: RESTORE_DUMP
              value: "__RESTORE_DUMP__" # placeholder — replaced at render time
            - name: BACKUP_BUCKET_URL
              valueFrom:
                configMapKeyRef:
                  name: postgres-backup-config
                  key: backup-bucket-url
            - name: BACKUP_OBJECT_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: postgres-backup-config
                  key: backup-object-prefix
          volumeMounts:
            - name: restore
              mountPath: /dump
      containers:
        - name: restore
          image: postgres:17
          command:
            - /bin/sh
            - -ec
            - |
              pg_restore --clean --if-exists --no-owner \
                -h postgres.warren.svc -p 5432 \
                -U "$PGUSER" -d "$PGDATABASE" \
                /dump/restore.dump
          env:
            - name: PGHOST
              value: postgres.warren.svc
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-db
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-password
          volumeMounts:
            - name: restore
              mountPath: /dump
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: restore
          emptyDir:
            sizeLimit: 12Gi
