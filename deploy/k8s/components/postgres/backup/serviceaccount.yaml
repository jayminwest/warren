# Workload-identity ServiceAccount for the backup CronJob and restore Job
# (warren-6db7). The k8s SA is federated to the GSA
# postgres-backup@warren-502318.iam.gserviceaccount.com, which holds
# objectCreator (and, for restore, objectViewer) on gs://warren-pg-backups-502318.
# The federation binding itself is operator work (warren-32bd):
#
#   gcloud iam service-accounts add-iam-policy-binding \
#     postgres-backup@warren-502318.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:warren-502318.svc.id.goog[warren/postgres-backup]"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
  namespace: warren
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: backup
  annotations:
    iam.gke.io/gcp-service-account: postgres-backup@warren-502318.iam.gserviceaccount.com
