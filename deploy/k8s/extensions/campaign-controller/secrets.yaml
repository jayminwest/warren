# SECRET TEMPLATE — PLACEHOLDER VALUES ONLY. Never commit real secrets here.
#
# For a real deploy, do NOT `kubectl apply` this file, and it is
# deliberately NOT in kustomization.yaml resources (the judge's
# secrets.yaml clobber, warren-0812, is the lesson). Create the secret
# imperatively so values never touch git:
#
#   kubectl -n warren create secret generic campaign-controller-secrets \
#     --from-literal=github-token=github_pat_...
#
# github-token is the READ-ONLY fine-grained PAT of the bot account
# (warren-run-bot): contents+metadata read on the upstream repo and the
# fork, plus notifications read. It must carry NO write scope — V0's
# GitHub transport is structurally read-only, and a mutation-capable
# credential in this Secret would only widen blast radius for zero
# function (RUNBOOK.md §1, §8). The credential that lets warren PUSH
# run branches to the fork is a different credential, held by warren's
# project registration — it never enters this extension.
#
# The controller's WARREN_API_TOKEN comes from the existing
# `warren-secrets` Secret (warren-api-token key) — warren's V1 auth is
# single-token (src/server/auth.ts), same gap the judge documents.
apiVersion: v1
kind: Secret
metadata:
  name: campaign-controller-secrets
  namespace: warren
  labels:
    app.kubernetes.io/name: warren
    app.kubernetes.io/component: campaign-controller
type: Opaque
stringData:
  github-token: "REPLACE_ME"
