# GKE Autopilot overlay (design k8s-migration-plan.md §3.2 — the hosted target).
#
# Differences from base:
#   - Images pulled from Artifact Registry (warren-502318/us-west1), pinned to
#     the deployed git SHA tag.
#   - Ingress is DELETED for now — exposure is `kubectl -n warren port-forward
#     svc/warren 8080:8080` until the smoke test passes and a domain + TLS are
#     chosen (gke-deploy-prep.md §6). When adding it back: ingressClassName
#     `gce`, Service → NodePort (or ClusterIP + NEG annotation), attach a
#     ManagedCertificate.
#   - CANOPY_REPO_URL is wired from warren-secrets (the Fly deploy had it; it
#     activates the canopy prompt-library agents).
#   - Autopilot ignores fixed storageClassName choices for some tiers; the
#     default `standard-rwo` binds the PVCs. For a multi-node repo-cache you
#     need an RWM class (Filestore) — see README (design R2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: warren
    newName: us-west1-docker.pkg.dev/warren-502318/warren/warren
    newTag: eb37a337
patches:
  # base/secrets.yaml is a placeholder TEMPLATE (README: "do not apply as-is").
  # The real secrets are created imperatively; applying the templates here
  # would clobber them with placeholder values. Delete both from the render.
  - target:
      kind: Secret
      name: warren-secrets
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: warren-secrets
        namespace: warren
  - target:
      kind: Secret
      name: warren-git-token
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: warren-git-token
        namespace: warren-runs
  # No Ingress until post-smoke-test (port-forward exposure first).
  - target:
      kind: Ingress
      name: warren
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: warren
        namespace: warren
  # Strategic-merge (keyed by env `name`) so the agent/init image env vars are
  # overridden regardless of list position.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: warren
        namespace: warren
      spec:
        template:
          spec:
            containers:
              - name: warren
                env:
                  - name: WARREN_K8S_AGENT_IMAGE
                    value: us-west1-docker.pkg.dev/warren-502318/warren/warren-agent:eb37a337
                  - name: WARREN_K8S_INIT_IMAGE
                    value: us-west1-docker.pkg.dev/warren-502318/warren/warren-workspace-init:eb37a337
                  - name: CANOPY_REPO_URL
                    valueFrom:
                      secretKeyRef:
                        name: warren-secrets
                        key: canopy-repo-url
                        optional: true
                  # Agent-commit identity forwarded into run pods as
                  # GIT_AUTHOR_*/GIT_COMMITTER_* (composeRunEnv). Without it
                  # every in-pod `git commit` fails with "Author identity
                  # unknown" (warren-4e36). The noreply address keeps agent
                  # commits attributed to the operator's GitHub account.
                  - name: WARREN_GIT_AUTHOR_NAME
                    value: warren
                  - name: WARREN_GIT_AUTHOR_EMAIL
                    value: jayminwest+warren@users.noreply.github.com
