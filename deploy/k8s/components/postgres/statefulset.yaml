# In-cluster Postgres StatefulSet (warren-9f5a); the production database since
# the 2026-09-03 cutover (warren-c01d, RUNBOOK-K8S §1.5).
#
# Image major is pinned to 17 so a same-major `pg_restore` of a pre-cutover dump
# (warren-c4b7) stays possible.
#
# storageClassName is deliberately OMITTED on the volumeClaimTemplate: omitting
# it binds the GKE default StorageClass (standard-rwo on Autopilot) and keeps
# the manifest portable to kind/k3d local validation. Pinning a class here would
# break one of the two every time.
#
# No spot selector: the DB is the one workload that must survive a node
# preemption without a restore-from-backup dance.
#
# safe-to-evict "false" on the pod template (warren-a5d2): GKE Autopilot's
# cluster autoscaler twice evicted postgres-0 for a node scale-down within 36
# minutes, and each eviction was a 20-40s full API outage (the replacement pod
# waits on a Multi-Attach of the RWO disk before Postgres can start). The
# annotation takes the node out of scale-down candidacy while postgres-0 runs
# on it. The matching PodDisruptionBudget lives in the gke overlay
# (overlays/gke/postgres-pdb.yaml) so the deploy workflow applies it; see
# docs/RUNBOOK-K8S.md §1.5 "Disruption protection".
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: warren
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-db
            - name: PGDATA
              # Subdirectory of the mounted volume: a lost+found at the volume
              # root makes postgres refuse to initdb there.
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - warren
                - -d
                - warren
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        # storageClassName omitted — GKE default standard-rwo (see header).
        resources:
          requests:
            storage: 10Gi
