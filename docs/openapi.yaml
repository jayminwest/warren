      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /setup:
    get:
      operationId: setupHandoffHandler
      tags:
        - setup
      summary: GET /setup
      responses:
        '200':
          description: Successful response.
        default:
          description: Error response (see `src/core/errors.ts`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: >-
        warren-48f8: setup-code redemption; anonymous by necessity — the code IS the auth. 404
        unless the boot armed the handoff (src/server/setup-handoff.ts).
  /version:
    get:
      operationId: versionHandler
      tags:
        - meta
      summary: GET /version
