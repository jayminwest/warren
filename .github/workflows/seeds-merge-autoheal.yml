name: seeds-merge-autoheal

# Self-heal for warren-b34b. `.gitattributes` routes `.seeds/*.jsonl` (and the
# mulch state files) through the custom `merge=seeds-jsonl` driver, a real
# 3-way id-keyed merge (scripts/merge-seeds-jsonl.ts) registered by
# package.json's prepare script. GitHub's server-side merge does NOT run custom
# merge drivers, so every PR that rewrites a `.seeds` row shows
# mergeable=CONFLICTING on GitHub the moment any other `.seeds` change lands on
# main — even though the same merge is clean (and correct) in a local clone
# where the driver exists. `gh pr update-branch` refuses, auto-merge stalls,
# and the plan-run merge gate cannot clear itself.
#
# This workflow watches PRs that touch `.seeds/*.jsonl`. When GitHub reports
# the PR CONFLICTING, it checks out the PR branch, registers the driver,
# performs the driver-aware `git merge origin/main`, verifies row integrity
# (check:seeds-integrity + a duplicate-id scan), and pushes the merge commit
# back to the PR branch. GitHub then recomputes mergeability and reports
# MERGEABLE. If the textual conflict is genuine (driver merge fails), the job
# exits non-zero and leaves the PR for a repair run.
#
# Loop guard: the heal push re-triggers this workflow (pull_request
# synchronize). The sentinel `[seeds-autoheal]` in the head commit message
# makes the re-trigger exit immediately, so the workflow can never retrigger
# itself endlessly. A NON-conflicting PR also exits immediately, so ordinary
# synchronize events cost one cheap mergeability check.
#
# Fork PRs are skipped (head repo must equal this repo) — a fork branch is not
# pushable and must not receive a token.
#
# Uses the same GitHub App installation token as auto-merge.yml /
# bundle-size-autoheal.yml (not GITHUB_TOKEN) so the heal push re-triggers CI;
# GITHUB_TOKEN-authored pushes are suppressed by GitHub to avoid recursion.
# NOTE: pull_request workflows run from the MERGE-BASE copy of this file, so
# this only takes effect once merged to main.

# warren-c84c: the CONFLICTING state this workflow heals is CREATED by a
# push to main (another PR's `.seeds` change merging), not by any event on
# the still-open victim PR. A `pull_request`-only trigger therefore never
# fires for exactly the case this workflow exists for unless the agent
# happens to push again. The `push` trigger below closes that gap: after
# every `.seeds` merge to main, the scan job finds open CONFLICTING PRs that
# touch `.seeds/*.jsonl` and the heal-scan matrix heals each one serially
# (max-parallel: 1, so two heals never race on `.seeds` state).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".seeds/*.jsonl"
  push:
    branches: [main]
    paths:
      - ".seeds/*.jsonl"

permissions:
  contents: write
  pull-requests: read

# One global, non-cancelling group serializes every run of this workflow, so
# a main-push scan (and its heal matrix) can never race a pull_request-event
# heal on the same branch. Sequence beats speed here: a queued heal simply
# finds the PR already mergeable and exits in the gate step.
concurrency:
  group: seeds-autoheal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    # Skip fork PRs and anything targeting main itself.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # gh runs before any actions/checkout in the gate step, so it must not
      # infer the repo from a git remote. GH_REPO makes every gh invocation
      # (pr view, api) repo-explicit regardless of the working directory.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Decide whether a heal is needed
        id: gate
        run: |
          set -euo pipefail
          # Loop guard: our own heal push re-triggers this workflow via
          # pull_request synchronize. The sentinel in the head commit message
          # makes that re-trigger exit immediately.
          msg="$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" --jq .commit.message)"
          if printf '%s' "$msg" | grep -qF '[seeds-autoheal]'; then
            echo "Head commit is our own heal merge — exiting to avoid a retrigger loop."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub computes mergeability asynchronously; poll briefly for a
          # definitive answer before deciding there is nothing to heal.
          state=""
          for i in 1 2 3 4 5 6; do
            state="$(gh pr view "$PR_NUMBER" --json mergeable --jq .mergeable)"
            echo "poll $i: mergeable=$state"
            [ "$state" = "UNKNOWN" ] || break
            sleep 10
          done
          if [ "$state" != "CONFLICTING" ]; then
            echo "PR is $state — nothing to heal."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PR is CONFLICTING — attempting the driver-aware heal merge."
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Mint app installation token
        id: app-token
        if: steps.gate.outputs.needed == 'true'
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        if: steps.gate.outputs.needed == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.needed == 'true'
        with:
          bun-version-file: .bun-version

      # bun install runs the prepare script, which registers
      # merge.seeds-jsonl.driver. Register it explicitly too so the heal does
      # not silently depend on prepare surviving refactors.
      - name: Install deps and register the seeds-jsonl merge driver
        if: steps.gate.outputs.needed == 'true'
        run: |
          set -euo pipefail
          bun install
          git config merge.seeds-jsonl.driver 'bun scripts/merge-seeds-jsonl.ts %O %A %B'

      - name: Driver-aware merge of origin/main into the PR branch
        if: steps.gate.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git config user.name "factory-droid[bot]"
          git config user.email "138933559+factory-droid[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge origin/main --no-edit -m "merge origin/main via seeds-jsonl driver [seeds-autoheal]"; then
            echo "::error::Driver-aware merge conflicted — this is a genuine textual conflict, not warren-b34b. Leaving the PR for a repair run."
            git merge --abort || true
            exit 1
          fi

      - name: Verify row integrity of the merged tree
        if: steps.gate.outputs.needed == 'true'
        run: |
          set -euo pipefail
          bun run check:seeds-integrity
          dups="$(jq -r .id .seeds/issues.jsonl | sort | uniq -d)"
          if [ -n "$dups" ]; then
            echo "::error::Duplicate issue ids after merge: $dups"
            exit 1
          fi
          echo "Row integrity OK: $(wc -l < .seeds/issues.jsonl) rows, all ids unique."

      - name: Push the heal merge back to the PR branch
        if: steps.gate.outputs.needed == 'true'
        run: git push origin "HEAD:${HEAD_BRANCH}"

  # Push-to-main trigger (warren-c84c): a `.seeds` merge to main is what
  # makes open `.seeds`-touching PRs flip to CONFLICTING, and no pull_request
  # event fires on those PRs when it happens. Scan for them here.
  # warren-c97b / warren-61aa: the scan must not filter on mergeability in
  # a single un-polled `gh pr list` — GitHub still reports UNKNOWN for the
  # PRs this push just flipped, so they were silently dropped and never
  # rechecked. Poll each candidate like the heal job does instead.
  scan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.scan.outputs.prs }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find open CONFLICTING PRs that touch .seeds/*.jsonl
        id: scan
        run: |
          set -euo pipefail
          prs="[]"
          # Only same-repo PRs are candidates: a fork branch is not pushable
          # and must never receive a token (same rule as the heal job).
          #
          # Do NOT filter on `.mergeable == "CONFLICTING"` in a single
          # `gh pr list`. The `.seeds` merge to main that fired this push is
          # what flips open `.seeds`-touching PRs CONFLICTING, and GitHub
          # computes `mergeable` asynchronously: for the seconds right after
          # the main push those PRs still report `UNKNOWN`, so an un-polled
          # list drops them and nothing else rechecks (warren-c97b/61aa).
          # Enumerate every open same-repo PR, pre-filter on touched files,
          # then poll each candidate's mergeability until it resolves (bounded
          # to match the heal job) before deciding whether to heal.
          for n in $(gh pr list --state open --json number,isCrossRepository \
              --jq '.[] | select(.isCrossRepository | not) | .number'); do
            # Pre-filter on files so we only poll PRs that can be CONFLICTING
            # for warren-b34b reasons at all.
            if ! gh pr view "$n" --json files --jq '.files[].path' | grep -qE '^\.seeds/.*\.jsonl$'; then
              continue
            fi
            state=""
            for i in 1 2 3 4 5 6; do
              state="$(gh pr view "$n" --json mergeable --jq .mergeable)"
              echo "PR #$n poll $i: mergeable=$state"
              [ "$state" = "UNKNOWN" ] || break
              sleep 10
            done
            if [ "$state" != "CONFLICTING" ]; then
              echo "PR #$n is $state — no heal needed."
              continue
            fi
            echo "candidate: PR #$n"
            prs="$(printf '%s' "$prs" | jq -c --argjson n "$n" '. + [$n]')"
          done
          echo "heal candidates: $prs"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  heal-scan:
    needs: scan
    if: github.event_name == 'push' && needs.scan.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serial: two heals running concurrently would push competing merge
      # commits to different branches off the same origin/main, and GitHub
      # recomputes mergeability per push anyway. One at a time is correct.
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.scan.outputs.prs) }}
    env:
      PR_NUMBER: ${{ matrix.pr }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Decide whether a heal is needed
        id: gate
        run: |
          set -euo pipefail
          HEAD_BRANCH="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
          echo "HEAD_BRANCH=$HEAD_BRANCH" >> "$GITHUB_ENV"
          # A queued scan-run may arrive after the PR merged or after a
          # successful heal; skip cheaply in both cases.
          pr_state="$(gh pr view "$PR_NUMBER" --json state --jq .state)"
          if [ "$pr_state" != "OPEN" ]; then
            echo "PR is $pr_state — nothing to heal."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          msg="$(gh api "repos/${{ github.repository }}/commits/$sha" --jq .commit.message)"
          if printf '%s' "$msg" | grep -qF '[seeds-autoheal]'; then
            echo "Head commit is our own heal merge — exiting to avoid a retrigger loop."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state="$(gh pr view "$PR_NUMBER" --json mergeable --jq .mergeable)"
          if [ "$state" != "CONFLICTING" ]; then
            echo "PR is $state — nothing to heal."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PR is CONFLICTING — attempting the driver-aware heal merge."
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Mint app installation token
        id: app-token
        if: steps.gate.outputs.needed == 'true'
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        if: steps.gate.outputs.needed == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.needed == 'true'
        with:
          bun-version-file: .bun-version

      - name: Install deps and register the seeds-jsonl merge driver
        if: steps.gate.outputs.needed == 'true'
        run: |
          set -euo pipefail
          bun install
          git config merge.seeds-jsonl.driver 'bun scripts/merge-seeds-jsonl.ts %O %A %B'

      - name: Driver-aware merge of origin/main into the PR branch
        if: steps.gate.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git config user.name "factory-droid[bot]"
          git config user.email "138933559+factory-droid[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge origin/main --no-edit -m "merge origin/main via seeds-jsonl driver [seeds-autoheal]"; then
            echo "::error::Driver-aware merge conflicted — this is a genuine textual conflict, not warren-b34b. Leaving the PR for a repair run."
            git merge --abort || true
            exit 1
          fi

      - name: Verify row integrity of the merged tree
        if: steps.gate.outputs.needed == 'true'
        run: |
          set -euo pipefail
          bun run check:seeds-integrity
          dups="$(jq -r .id .seeds/issues.jsonl | sort | uniq -d)"
          if [ -n "$dups" ]; then
            echo "::error::Duplicate issue ids after merge: $dups"
            exit 1
          fi
          echo "Row integrity OK: $(wc -l < .seeds/issues.jsonl) rows, all ids unique."

      - name: Push the heal merge back to the PR branch
        if: steps.gate.outputs.needed == 'true'
        run: git push origin "HEAD:${HEAD_BRANCH}"
