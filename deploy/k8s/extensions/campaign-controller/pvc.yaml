# The controller's entire durable state — campaigns, work items, the
# action journal, budget reservations, GitHub event dedupe, attention
# items, and leases — one SQLite file at /app/data/campaign.db
# (CAMPAIGN_DB_PATH). Must survive pod replacement: restart
# reconciliation reads this store to resume known runs and fail closed
# on uncertain dispatches instead of re-POSTing paid work
# (extensions/campaign-controller/RUNBOOK.md §6). storageClassName
# intentionally omitted so each cluster's default class binds
# (standard-rwo on GKE).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: campaign-controller-data
  namespace: warren
  labels:
    app.kubernetes.io/name: warren
    app.kubernetes.io/component: campaign-controller
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
