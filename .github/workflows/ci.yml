name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install
      - run: bun run ext:install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:agents
      - run: bun run gen:docs:check
      - run: bun run gen:openapi:check
      - run: bun run check:size
      - run: bun run check:debt
      - run: bun run check:dups
      - run: bun run check:ci-parity
      - run: bun run ui:install
      - run: bun run check:deps
      - run: bun run build:ui
      - run: bun run check:bundle-size
      - name: Run tests with coverage + JUnit reporter
        run: bun run check:coverage:ci

      - name: Test timing summary
        if: always()
        run: bun run report:test-timing

      - name: Surface failing tests as annotations
        if: failure()
        run: bun run report:test-failures

      - name: Code-quality metrics summary
        if: always()
        run: bun run report:quality-metrics

      - name: Build the file-size overshoot report
        if: failure()
        run: |
          set -euo pipefail
          if bun run check:size > /dev/null 2>&1; then
            echo "check:size passes on this branch, so the failure was something else."
            exit 0
          fi
          mkdir -p size-overshoot
          bun run scripts/check-file-sizes.ts --headroom 10 > size-overshoot/report.txt

      - name: Upload the file-size overshoot report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: size-overshoot-report
          path: size-overshoot/report.txt
          if-no-files-found: ignore

      - name: Upload test timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-test-junit
          path: test-results/junit.xml
          if-no-files-found: warn

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-test-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  # Builds the release container image on every PR so a broken Dockerfile
  # or an un-regenerated lockfile is caught before it reaches a release
  # tag, not after (warren-3380). Build only — no push, no registry login.
  # GitHub Actions layer caching (type=gha) keeps it affordable. This is a
  # CI-only job, deliberately not a check:all gate (the manifest is frozen).
  #
  # amd64-only, even though the released public image is multi-arch
  # (warren-fe9f): an arm64 build runs under QEMU emulation and would slow
  # every PR by many minutes. The release-time arm64 failure risk this
  # leaves open is bounded by the draft-until-image-exists ordering
  # (warren-89f2) — a broken arm64 build fails release.yml's deploy job and
  # blocks promotion, never a published release pointing at a missing
  # image.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          tags: warren:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
