# Warren K8s base (warren-74b5). Controller-/cloud-agnostic manifests; pick an
# overlay (../overlays/kind or ../overlays/gke) for a real apply. kustomize orders
# by kind, so namespaces are created before the resources that land in them.
#
# servicemonitor.yaml (one dir up) is intentionally NOT included: it needs the
# Prometheus Operator CRD (monitoring.coreos.com/v1), which a bare kind/k3d
# cluster lacks — including it would fail `kubectl apply`. Apply it separately on
# clusters that run the operator (see README).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - resourcequota.yaml
  - networkpolicy.yaml
  - secrets.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
