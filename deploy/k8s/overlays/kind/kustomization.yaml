# Local-cluster overlay: kind (also works on k3d — see README note on ingress).
#
# Differences from base:
#   - Ingress class `nginx` (deploy ingress-nginx first) + a wildcard-DNS host
#     (warren.localtest.me resolves to 127.0.0.1 with no /etc/hosts edit).
#   - imagePullPolicy Never: images are `kind load`-ed / `k3d image import`-ed
#     into the node, never pulled from a registry.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # base/secrets.yaml is a placeholder TEMPLATE (README: "Secrets — never
  # commit real values"). Applying it would install REPLACE_ME Secrets (or
  # clobber real ones created imperatively), so delete all three from the
  # render. Create the real Secrets BEFORE `kubectl apply` — the imperative
  # commands are in ../../README.md and in the header of base/secrets.yaml
  # (warren-df5c).
  - target:
      kind: Secret
      name: warren-secrets
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: warren-secrets
        namespace: warren
  - target:
      kind: Secret
      name: warren-git-token
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: warren-git-token
        namespace: warren-runs
  - target:
      kind: Secret
      name: warren-openrouter-key
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: warren-openrouter-key
        namespace: warren-runs
  - target:
      kind: Ingress
      name: warren
    patch: |
      - op: add
        path: /spec/ingressClassName
        value: nginx
      - op: replace
        path: /spec/rules/0/host
        value: warren.localtest.me
  - target:
      kind: Deployment
      name: warren
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
