# .warren/triggers.yaml — scheduled runs for this project (SPEC §11.I, R-06).
#
# Each entry is a cron-style trigger. Warren ticks once a minute and
# spawns a run when a trigger is due. Today only `kind: cron` is
# implemented; the `kind:` discriminator leaves room for future
# webhook-style triggers without a breaking schema rev.
#
# Required fields: id, kind, cron, role.
# Optional fields: seed, timezone (default UTC), prompt.
#
# Field rules (TriggersConfigSchema in src/warren-config/schema.ts):
#   id        kebab/snake-case (lowercase, digits, dots, dashes, _). Unique.
#   kind      'cron'
#   cron      5 or 6 whitespace-separated fields (croner-compatible)
#   seed      seed id the agent reads + writes (e.g. warren-xxxx)
#   role      registered agent name (kebab/snake-case)
#   timezone  IANA tz name, e.g. America/Los_Angeles
#   prompt    pre-filled into the agent; multi-line ok via `|`
#
# Example (uncomment to enable):
#
# - id: nightly-housekeeping
#   kind: cron
#   cron: '0 3 * * *'          # 03:00 daily
#   seed: warren-housekeep
#   role: claude-code
#   timezone: America/Los_Angeles
#   prompt: |
#     Run the housekeeping checklist and file seeds for anything off.

# ---------------------------------------------------------------------
# NO TRIGGERS ARE ACTIVE. This is deliberate, not a temporary outage.
#
# Warren used to schedule six agents against its own repo: two patrols
# (nightwatch, bugwatch) and a four-agent "Audit Warden" population
# (gatewatch, ratchetwatch, tastewatch, warden-digest). Operator decision
# 2026-07-28 (warren-a781): the audit population is retired outright and
# nothing runs on a schedule here.
#
# Why the wardens went: they billed tokens nightly to file findings that
# accumulated faster than anyone triaged them — ~90 seeds across their
# lifetime, and the four still open at retirement were all obsolete. The
# standards they enforced did not depend on them. Article I and Article
# IX are human review rules, and Article II's ratchets are already
# mechanical gates — check:size, check:coverage, check:debt and
# check:bundle-size run on every PR whether or not an agent watches them.
# An auditor that only restates what a gate already enforces is a
# scheduled bill, not a control.
#
# nightwatch is KEPT as warren's worked example of an autonomous agent.
# It survives as a built-in TS module (src/registry/builtins/nightwatch.ts)
# with test coverage — one patrol demonstrates the whole loop warren
# exists to show: patrol -> seeds plan -> auto_plan_run -> PR. bugwatch
# also still ships as a built-in for operators who want it; neither is
# scheduled on this instance.
#
# To re-enable the example, uncomment the block below. Note warren-af3f:
# cron-triggered patrols succeeded only 32% of the time in production
# (never_started and dropped_commit are the two dominant failure modes).
# Fix that before scheduling anything nightly.
#
# An empty trigger list is valid — warren parses this file and schedules
# nothing.
# ---------------------------------------------------------------------

# - id: nightwatch-patrol
#   kind: cron
#   cron: '0 2 * * 0'          # weekly, Sunday 02:00
#   role: nightwatch
#   timezone: America/Los_Angeles
#   prompt: |
#     Scan this repo for quality issues. Follow your procedure exactly.
#     Today's date is {{date}}. If you find issues, file a plan. If the
#     codebase is clean, report clean and exit.

