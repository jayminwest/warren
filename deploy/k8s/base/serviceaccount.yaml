# ServiceAccount the warren control-plane Deployment runs as (warren-74b5).
#
# `@kubernetes/client-node` inside the pod reads THIS SA's projected token
# (in-cluster config) to authenticate to the K8s API. Its permissions come
# solely from the RoleBinding in `warren-runs` (rbac.yaml) — this SA has NO
# cluster-scoped binding, so it can do nothing outside that one namespace
# (design k8s-migration.md Q4).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warren
  namespace: warren
  labels:
    app.kubernetes.io/name: warren
    app.kubernetes.io/component: control-plane
