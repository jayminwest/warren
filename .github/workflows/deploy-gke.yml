name: GKE Build & Deploy

# Build + push the four warren container images to Artifact Registry, then
# (on a published release or a manual dispatch that opts in) roll the GKE
# Autopilot deployment forward to the freshly built, SHA-pinned images
# (warren-bd79). Replaces the manual `deploy/docker/build-images.sh` +
# `kubectl apply -k` flow documented in docs/RUNBOOK-K8S.md §1.2-1.3.
#
# The control-plane image is ALSO published to the public ghcr.io registry
# (warren-26be) — that is the image docker-compose.yml pulls, so the
# "one container, five-minute self-host" path never builds from source.
# The public image is multi-arch (linux/amd64 + linux/arm64, warren-fe9f)
# so Apple Silicon self-hosters get a native arm64 image. Only the control
# plane goes public; warren-agent and warren-workspace-init only ever run
# on GKE and stay in the private Artifact Registry.
#
# Auth is GCP Workload Identity Federation — no long-lived JSON keys. A repo
# admin configures the OIDC provider + service account as secrets and the
# project/region/cluster as repo variables (see docs/RUNBOOK-K8S.md §1.6).
#
# This is the deploy path: release.yml calls this workflow directly (via
# `workflow_call`) after it publishes a GitHub release, or an opt-in manual
# dispatch rolls GKE forward. There is no Fly.io deploy.
#
# We deliberately do NOT trigger on `release: [published]`. GitHub suppresses
# workflow runs for events created with the default GITHUB_TOKEN (release.yml
# cuts releases with `gh release create` under `github.token`), so a
# release-event trigger would silently never fire — the exact regression
# tracked in warren-cb81. release.yml invokes us with an explicit SHA instead.
#
# There is also NO `push` trigger (warren-8b5f). A push to main used to build
# all three images, and the release that same push kicks off called us AGAIN —
# two full builds per release, serialized by the concurrency group below, for
# one commit. release.yml is now the only builder; `workflow_dispatch` is the
# manual escape hatch. (The `k8s-migration` build-and-deploy entry went with
# it: that branch merged in v0.10.0, and until now anyone pushing it deployed
# straight to production.)

on:
  workflow_call:
    inputs:
      sha:
        description: "Exact commit SHA to build + deploy (the released commit)"
        type: string
        required: true
      deploy:
        description: "Roll GKE forward after building (release path sets true)"
        type: boolean
        default: true
      version:
        description: "Released semver (no leading v) — adds :vX.Y.Z and :X.Y ghcr.io tags"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also roll GKE forward to the freshly built images"
        type: boolean
        default: false

# Match the registry layout the gke overlay and cloudbuild.yaml already use:
#   <region>-docker.pkg.dev/<project>/<repo>/<image>:<tag>
# AR_BASE references only `vars` (allowed at workflow scope); project id is
# required, region + repo default to the live values (us-west1 / warren).
env:
  AR_BASE: ${{ vars.GCP_REGION || 'us-west1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO || 'warren' }}
  REGISTRY_HOST: ${{ vars.GCP_REGION || 'us-west1' }}-docker.pkg.dev
  # Public home of the control-plane image (warren-26be). ghcr.io requires a
  # lowercase path; `jayminwest/warren` already is. Kept as an expression
  # rather than a literal so a fork publishes under its own owner.
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/warren
  # The commit to build + deploy. workflow_call passes the released SHA
  # explicitly (github.sha is unreliable across a reusable-workflow boundary
  # and for tag/release events); a manual dispatch falls back to github.sha.
  TARGET_SHA: ${{ inputs.sha || github.sha }}

concurrency:
  group: gke-build-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
      packages: write # required to push the control-plane image to ghcr.io
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # ghcr.io needs no provisioned secret — the job's own GITHUB_TOKEN,
      # scoped by `permissions: packages: write` above, is the credential.
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # QEMU provides the arm64 emulation the multi-arch public ghcr.io
      # build below needs (warren-fe9f); GitHub-hosted runners are amd64.
      - uses: docker/setup-qemu-action@v4

      # Public tag set for the control-plane image (warren-26be). Self-hosters
      # pull this image from docker-compose.yml, so it carries semver as well
      # as the commit SHA: `:<sha>` and `:latest` on every build, plus
      # `:vX.Y.Z` and the moving `:X.Y` when a caller passes a released
      # version (release.yml threads its version-check output through
      # workflow_call). `:X.Y` is deliberately withheld from prereleases — a
      # moving minor tag must never resolve to an rc.
      - name: Compute ghcr.io tags for the control-plane image
        id: ghcr-tags
        env:
          SHA: ${{ env.TARGET_SHA }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          {
            echo "tags<<GHCR_TAGS_EOF"
            echo "${GHCR_IMAGE}:${SHA}"
            echo "${GHCR_IMAGE}:latest"
            if [ -n "${VERSION}" ]; then
              echo "${GHCR_IMAGE}:v${VERSION}"
              if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "${GHCR_IMAGE}:${VERSION%.*}"
              fi
            fi
            echo "GHCR_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Autopilot schedules amd64; a single-arch arm64 image CrashLoops with
      # `exec format error`. A multi-arch MANIFEST would still be safe on GKE
      # (each node pulls the layer set for its own arch), but the
      # GKE-internal Artifact Registry images deliberately stay amd64-only:
      # no arm64 node ever pulls them, and skipping the QEMU arm64 build
      # keeps the deploy-critical AR push fast and immune to emulation
      # flakes. Only the PUBLIC ghcr.io image is multi-arch (warren-fe9f,
      # next step). All four AR builds run on native amd64 with GHA layer
      # cache (per-image scope), tagged by the full commit SHA and `latest`.
      - name: Build + push warren (control plane, Artifact Registry)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AR_BASE }}/warren:${{ env.TARGET_SHA }}
            ${{ env.AR_BASE }}/warren:latest
          cache-from: type=gha,scope=warren-control
          cache-to: type=gha,mode=max,scope=warren-control

      # The public self-hoster image is multi-arch (warren-fe9f): amd64 +
      # arm64 in one manifest list, so `docker pull` on Apple Silicon gets
      # a native arm64 image instead of amd64-under-emulation — where
      # CLONE_NEWUSER breaks and every run dies. The amd64 half reuses the
      # layer cache the Artifact Registry build above just wrote; only the
      # arm64 half builds fresh under QEMU, and only on this release path.
      # PR CI (ci.yml docker-build) stays amd64-only for speed: a broken
      # arm64 build here fails before the `promote` job flips the draft
      # release public (warren-89f2), so it blocks promotion, not
      # visibility.
      - name: Build + push warren (control plane, public ghcr.io)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ghcr-tags.outputs.tags }}
          cache-from: |
            type=gha,scope=warren-control
            type=gha,scope=warren-control-multiarch
          cache-to: type=gha,mode=max,scope=warren-control-multiarch

      - name: Build + push warren-agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AR_BASE }}/warren-agent:${{ env.TARGET_SHA }}
            ${{ env.AR_BASE }}/warren-agent:latest
          cache-from: type=gha,scope=warren-agent
          cache-to: type=gha,mode=max,scope=warren-agent

      - name: Build + push warren-workspace-init
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.workspace-init
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AR_BASE }}/warren-workspace-init:${{ env.TARGET_SHA }}
            ${{ env.AR_BASE }}/warren-workspace-init:latest
          cache-from: type=gha,scope=warren-init
          cache-to: type=gha,mode=max,scope=warren-init

      # The judge extension image (extensions/judge, warren-eecb). Built from
      # the extension directory ALONE — extensions build against warren's
      # public HTTP surface only (docs/design/extensions.md §2), so the build
      # context is the package, exactly as a third party would ship theirs.
      # Before this step the image was built + pushed from a laptop (docker
      # buildx, tag = git sha), so a judge fix required a workstation with
      # registry credentials.
      - name: Build + push warren-ext-judge
        uses: docker/build-push-action@v7
        with:
          context: extensions/judge
          file: extensions/judge/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AR_BASE }}/warren-ext-judge:${{ env.TARGET_SHA }}
            ${{ env.AR_BASE }}/warren-ext-judge:latest
          cache-from: type=gha,scope=warren-ext-judge
          cache-to: type=gha,mode=max,scope=warren-ext-judge

      # The campaign-controller extension image
      # (extensions/campaign-controller, plan pl-91b6). Same contract as
      # the judge: built from the extension directory ALONE, first deploy
      # manual via the gitignored gke-live-campaign-controller overlay,
      # CI only ever rolls an existing Deployment forward.
      - name: Build + push warren-ext-campaign-controller
        uses: docker/build-push-action@v7
        with:
          context: extensions/campaign-controller
          file: extensions/campaign-controller/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AR_BASE }}/warren-ext-campaign-controller:${{ env.TARGET_SHA }}
            ${{ env.AR_BASE }}/warren-ext-campaign-controller:latest
          cache-from: type=gha,scope=warren-ext-campaign-controller
          cache-to: type=gha,mode=max,scope=warren-ext-campaign-controller

  deploy:
    needs: build-push
    # Roll GKE forward only when the caller opts in. `inputs.deploy` is set by
    # both entrypoints — release.yml passes true via workflow_call, a manual
    # dispatch ticks the checkbox — so a build-only dispatch leaves the
    # cluster alone. No branch ever deploys by itself (warren-8b5f).
    if: inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: gke-deploy-warren
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER || 'warren' }}
          location: ${{ vars.GKE_LOCATION || vars.GCP_REGION || 'us-west1' }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # Materialize the gitignored `gke-live` overlay on the runner (it is
      # never committed — see .gitignore). It layers on the committed `gke`
      # template and pins all three images to this commit's SHA, mirroring the
      # documented gke-live pattern (deploy/k8s/overlays/gke/kustomization.yaml
      # header). The control-plane image is remapped via kustomize `images:`
      # (matching the template's post-transform name); the agent + init images
      # are env vars on the Deployment, so they are overridden with a strategic
      # merge patch keyed by env `name`.
      #
      # NOTE on the `images:` match key below: the `warren/warren` segment is
      # the committed gke template's own placeholder
      # (deploy/k8s/overlays/gke/kustomization.yaml `images[0].newName`), NOT
      # `vars.GCP_AR_REPO`. It is a literal that must equal that template
      # value or the remap silently no-ops; `scripts/deploy-trigger.test.ts`
      # pins the two together. The operator's real repo only ever appears in
      # `newName`, via AR_BASE — so GCP_AR_REPO is honoured (warren-8b5f).
      - name: Render gke-live overlay pinned to ${{ github.sha }}
        env:
          SHA: ${{ env.TARGET_SHA }}
          GIT_AUTHOR_NAME: ${{ vars.WARREN_GIT_AUTHOR_NAME || 'warren' }}
          GIT_AUTHOR_EMAIL: ${{ vars.WARREN_GIT_AUTHOR_EMAIL || 'warren@users.noreply.github.com' }}
          INGRESS_HOST: ${{ vars.WARREN_INGRESS_HOST }}
          REPO_CACHE_PVC: ${{ vars.WARREN_K8S_REPO_CACHE_PVC }}
          K8S_SPOT: ${{ vars.WARREN_K8S_SPOT }}
          K8S_MEMORY_REQUEST_MIB: ${{ vars.WARREN_K8S_MEMORY_REQUEST_MIB }}
          K8S_MEMORY_LIMIT_MIB: ${{ vars.WARREN_K8S_MEMORY_LIMIT_MIB }}
        run: |
          set -euo pipefail
          mkdir -p deploy/k8s/overlays/gke-live
          cat > deploy/k8s/overlays/gke-live/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../gke
          images:
            - name: LOCATION-docker.pkg.dev/PROJECT/warren/warren
              newName: ${AR_BASE}/warren
              newTag: ${SHA}
          patches:
            - patch: |
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: warren
                  namespace: warren
                spec:
                  template:
                    spec:
                      containers:
                        - name: warren
                          env:
                            - name: WARREN_K8S_AGENT_IMAGE
                              value: ${AR_BASE}/warren-agent:${SHA}
                            - name: WARREN_K8S_INIT_IMAGE
                              value: ${AR_BASE}/warren-workspace-init:${SHA}
                            - name: WARREN_GIT_AUTHOR_NAME
                              value: ${GIT_AUTHOR_NAME}
                            - name: WARREN_GIT_AUTHOR_EMAIL
                              value: ${GIT_AUTHOR_EMAIL}
          EOF
          # If a hostname is configured, patch the placeholder Ingress host and
          # ManagedCertificate domain (both are placeholders in the gke
          # template — never commit the real hostname).
          # Ingress spec.rules has no strategic-merge key, so a partial rule
          # patch REPLACES the whole rule and drops http.paths (learned live:
          # the LB then 404s every API path). Surgical JSON6902 replace of the
          # host field only.
          if [ -n "${INGRESS_HOST}" ]; then
            cat >> deploy/k8s/overlays/gke-live/kustomization.yaml <<EOF
            - target:
                kind: Ingress
                name: warren
                namespace: warren
              patch: |
                - op: replace
                  path: /spec/rules/0/host
                  value: ${INGRESS_HOST}
            - patch: |
                apiVersion: networking.gke.io/v1
                kind: ManagedCertificate
                metadata:
                  name: warren
                  namespace: warren
                spec:
                  domains:
                    - ${INGRESS_HOST}
          EOF
          fi
          # Opt-in repo-cache (warren-8175): when the repo variable
          # WARREN_K8S_REPO_CACHE_PVC names a claim, wire it onto the
          # Deployment so run-pod init containers reuse the shared git
          # mirror instead of re-cloning. The PVC itself is imperative
          # infra like the Secrets — created once by the operator, never
          # by this workflow (deploy/k8s/README.md "Repo cache (opt-in)";
          # RWO caveat: warren-554f — use an RWX class on multi-node).
          # Deployment env has a strategic-merge key (name), so this
          # partial patch appends the one entry without replacing the list.
          if [ -n "${REPO_CACHE_PVC}" ]; then
            cat >> deploy/k8s/overlays/gke-live/kustomization.yaml <<EOF
            - patch: |
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: warren
                  namespace: warren
                spec:
                  template:
                    spec:
                      containers:
                        - name: warren
                          env:
                            - name: WARREN_K8S_REPO_CACHE_PVC
                              value: ${REPO_CACHE_PVC}
          EOF
          fi
          # Opt-in repo variables (warren-ff6f), one strategic-merge patch
          # per non-empty variable, same shape as the repo-cache block above.
          # WARREN_K8S_SPOT pins run pods onto GKE Spot nodes (warren-2e2e);
          # the memory knobs record the imperatively-set control-plane sizing
          # in git so a fresh apply cannot silently drop them. Unset variables
          # append nothing.
          for kv in \
            "WARREN_K8S_SPOT=${K8S_SPOT}" \
            "WARREN_K8S_MEMORY_REQUEST_MIB=${K8S_MEMORY_REQUEST_MIB}" \
            "WARREN_K8S_MEMORY_LIMIT_MIB=${K8S_MEMORY_LIMIT_MIB}"; do
            name="${kv%%=*}"
            value="${kv#*=}"
            [ -n "${value}" ] || continue
            cat >> deploy/k8s/overlays/gke-live/kustomization.yaml <<EOF
            - patch: |
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: warren
                  namespace: warren
                spec:
                  template:
                    spec:
                      containers:
                        - name: warren
                          env:
                            - name: ${name}
                              value: ${value}
          EOF
          done
          echo "----- rendered gke-live kustomization -----"
          cat deploy/k8s/overlays/gke-live/kustomization.yaml

      - name: Validate render (kubectl kustomize)
        run: kubectl kustomize deploy/k8s/overlays/gke-live >/dev/null

      # `kubectl apply -k` GETs every object in the overlay before patching,
      # and a briefly unhealthy API server answers InternalError for arbitrary
      # ones (warren-5ca2: v0.18.0 needed three failed attempts before this
      # landed). Retrying the WHOLE overlay needs one pass where every GET
      # succeeds, which a bursty API server may never give. So render once,
      # then apply each resource on its own with its own bounded retry: a
      # resource that already converged is never re-rolled by a neighbour's
      # failure. Namespaces go first so every namespaced object has a home.
      # A resource that is still failing after the budget is fatal, after the
      # rest have had their chance, with every error left in the log — a
      # persistent manifest or auth failure is never hidden.
      - name: Apply overlay
        env:
          APPLY_ATTEMPTS: "8"
          APPLY_RETRY_SECONDS: "10"
        run: |
          set -uo pipefail
          RENDERED="${RUNNER_TEMP}/gke-live-rendered"
          rm -rf "${RENDERED}" && mkdir -p "${RENDERED}"
          kubectl kustomize deploy/k8s/overlays/gke-live -o "${RENDERED}" || exit 1
          files=()
          for f in "${RENDERED}"/*_namespace_*.yaml; do [ -e "${f}" ] && files+=("${f}"); done
          for f in "${RENDERED}"/*.yaml; do
            case "${f}" in *_namespace_*) ;; *) files+=("${f}") ;; esac
          done
          failed=0
          for f in "${files[@]}"; do
            name=$(basename "${f}" .yaml)
            attempt=1
            until kubectl apply -f "${f}"; do
              if [ "${attempt}" -ge "${APPLY_ATTEMPTS}" ]; then
                echo "::error::kubectl apply ${name} failed after ${APPLY_ATTEMPTS} attempts"
                failed=$((failed + 1))
                break
              fi
              sleep $((APPLY_RETRY_SECONDS * attempt))
              attempt=$((attempt + 1))
              echo "kubectl apply ${name}: attempt ${attempt}/${APPLY_ATTEMPTS}"
            done
          done
          if [ "${failed}" -gt 0 ]; then
            echo "::error::${failed} resource(s) failed to apply after ${APPLY_ATTEMPTS} attempts each"
            exit 1
          fi

      - name: Wait for rollout
        run: kubectl -n warren rollout status deploy/warren --timeout=300s

      # Fail loudly if the live control-plane image is not the exact SHA we
      # just built + rendered. Guards against a stale rollout silently passing
      # (warren-cb81 acceptance: the workflow must fail visibly if version
      # verification fails).
      - name: Verify rolled-out image matches release SHA
        env:
          SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          EXPECTED="${AR_BASE}/warren:${SHA}"
          ACTUAL=$(kubectl -n warren get deploy/warren \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="warren")].image}')
          echo "expected: ${EXPECTED}"
          echo "actual:   ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::Rolled-out warren image ${ACTUAL} does not match release image ${EXPECTED}"
            exit 1
          fi
          echo "Verified: warren deployment is running the released SHA ${SHA}."

      # Prove the entrypoint/agent uid split (warren-cb93) can privilege its
      # setpriv drop on the LIVE cluster with the agent image this run just
      # built — before any run is dispatched against it (warren-950d). A GKE
      # node auto-upgrade to containerd 2.x silently broke the split on
      # 2026-08-25 (capabilities.add lands bounding-only for a non-root
      # pid 1) and every dispatched run died at the preflight; this gate
      # turns that class of cluster drift into a red deploy instead. The
      # canary pod is rendered from the same builders the run pod uses
      # (scripts/k8s-uid-drop-canary.ts), so the gate cannot drift from
      # dispatch.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify agent uid-drop split on the live cluster
        env:
          SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run scripts/k8s-uid-drop-canary.ts \
            --image "${AR_BASE}/warren-agent:${SHA}" \
            --namespace warren-runs

      # The step above proves the Deployment *spec* points at the released
      # image. This one proves the public ingress actually serves it: GET
      # /version is auth-exempt and returns {"version":"X.Y.Z"} straight from
      # src/index.ts (README "Health & readiness probes"), which is exactly
      # what the endpoint was built for and nothing used until now
      # (warren-8b5f). Polled, because the GCE LB can keep draining old
      # backends for a while after `rollout status` returns.
      - name: Smoke-test /version over the ingress
        env:
          VERSION: ${{ inputs.version }}
          INGRESS_HOST: ${{ vars.WARREN_INGRESS_HOST }}
          SMOKE_ATTEMPTS: "12"
          SMOKE_INTERVAL: "10"
        run: |
          set -uo pipefail
          if [ -z "${VERSION}" ]; then
            echo "No released version passed (build-only or manual dispatch); nothing to assert."
            exit 0
          fi
          if [ -z "${INGRESS_HOST}" ]; then
            echo "::error::WARREN_INGRESS_HOST is unset, so the rollout of v${VERSION} cannot be verified over the ingress. Set the repo variable (docs/RUNBOOK-K8S.md §1.6)."
            exit 1
          fi
          URL="https://${INGRESS_HOST}/version"
          ACTUAL=""
          ATTEMPT=1
          while [ "${ATTEMPT}" -le "${SMOKE_ATTEMPTS}" ]; do
            BODY=$(curl -fsS --max-time 15 "${URL}" 2>/dev/null || true)
            ACTUAL=$(printf '%s' "${BODY}" | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            if [ "${ACTUAL}" = "${VERSION}" ]; then
              echo "Verified: ${URL} reports v${VERSION}."
              exit 0
            fi
            echo "attempt ${ATTEMPT}/${SMOKE_ATTEMPTS}: ${URL} reported '${ACTUAL:-<no response>}', want '${VERSION}'"
            ATTEMPT=$((ATTEMPT + 1))
            if [ "${ATTEMPT}" -le "${SMOKE_ATTEMPTS}" ]; then
              sleep "${SMOKE_INTERVAL}"
            fi
          done
          echo "::error::${URL} never reported version ${VERSION} (last saw '${ACTUAL:-<no response>}'). The rollout did not reach the ingress."
          exit 1

      # Roll the judge extension Deployment (extensions/judge) forward to the
      # image this run just pushed (warren-eecb). The judge is an OPT-IN
      # observer (docs/design/extensions.md): the first deploy is manual via
      # the gitignored gke-live-judge overlay, which owns the operator's
      # provider/model/budget env and whose Secrets are created imperatively.
      # So this step only ever moves the IMAGE on a Deployment that already
      # exists — `set image` leaves env and Secrets untouched, CI never
      # creates the judge, and a cluster that never opted in skips cleanly.
      # Runs last so a judge failure can never mask the warren rollout
      # verification above.
      - name: Roll judge extension deployment forward
        env:
          SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          if ! kubectl -n warren get deploy/judge >/dev/null 2>&1; then
            echo "No judge Deployment in the cluster (opt-in extension); skipping."
            exit 0
          fi
          EXPECTED="${AR_BASE}/warren-ext-judge:${SHA}"
          kubectl -n warren set image deploy/judge "judge=${EXPECTED}"
          kubectl -n warren rollout status deploy/judge --timeout=300s
          ACTUAL=$(kubectl -n warren get deploy/judge \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="judge")].image}')
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::Rolled-out judge image ${ACTUAL} does not match ${EXPECTED}"
            exit 1
          fi
          echo "Verified: judge deployment is running ${SHA}."

      # Roll the campaign-controller extension Deployment
      # (extensions/campaign-controller) forward on the same opt-in
      # contract as the judge above: image only, env/ConfigMap/Secrets
      # untouched, skip cleanly when the cluster never opted in.
      - name: Roll campaign-controller extension deployment forward
        env:
          SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          if ! kubectl -n warren get deploy/campaign-controller >/dev/null 2>&1; then
            echo "No campaign-controller Deployment in the cluster (opt-in extension); skipping."
            exit 0
          fi
          EXPECTED="${AR_BASE}/warren-ext-campaign-controller:${SHA}"
          kubectl -n warren set image deploy/campaign-controller "campaign-controller=${EXPECTED}"
          kubectl -n warren rollout status deploy/campaign-controller --timeout=300s
          ACTUAL=$(kubectl -n warren get deploy/campaign-controller \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="campaign-controller")].image}')
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::Rolled-out campaign-controller image ${ACTUAL} does not match ${EXPECTED}"
            exit 1
          fi
          echo "Verified: campaign-controller deployment is running ${SHA}."
