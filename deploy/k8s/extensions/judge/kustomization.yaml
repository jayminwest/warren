# Judge extension (extensions/judge, plan pl-17ca / warren-5fcf) — the
# bounded, read-only LLM judge collector deployed BESIDE warren in the
# `warren` namespace. Deliberately NOT part of ../../base: extensions are
# opt-in observers, never required infrastructure (docs/design/extensions.md).
#
# Deploy with an overlay that pins the real image (see
# ../../overlays/gke-live-judge, gitignored) after creating the judge
# Secret imperatively. secrets.yaml documents the required keys but is
# intentionally not rendered by this kustomization.
#
# The image (warren-ext-judge) is built + pushed by CI beside the other
# warren images, and the release deploy rolls an EXISTING judge Deployment
# forward to the released SHA via `kubectl set image` (warren-eecb,
# .github/workflows/deploy-gke.yml). CI never creates the judge and never
# touches its env or Secrets — first deploy stays manual and opt-in.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
