# SECRET TEMPLATES — PLACEHOLDER VALUES ONLY. Never commit real secrets here.
#
# For a real deploy, do NOT `kubectl apply` this file. Instead create the secrets
# imperatively (values never touch git):
#
#   kubectl -n warren create secret generic warren-secrets \
#     --from-literal=warren-api-token=... \
#     --from-literal=warren-db-url=postgres://... \
#     --from-literal=github-token=ghp_... \
#     --from-literal=anthropic-api-key=sk-ant-... \
#     --from-literal=sentry-dsn=https://...        # optional
#
#   kubectl -n warren-runs create secret generic warren-git-token \
#     --from-literal=token=ghp_...                 # same value as github-token
#
# These stub objects exist so `kustomize build` / dry-run validation resolves and
# so the key layout is documented in one place. The mapping to warren env vars is
# in deployment.yaml; the mapping to Fly's old secrets is design §6.3.
apiVersion: v1
kind: Secret
metadata:
  name: warren-secrets
  namespace: warren
  labels:
    app.kubernetes.io/name: warren
    app.kubernetes.io/component: control-plane
type: Opaque
stringData:
  # Control-plane API bearer token (protects every route except /healthz +
  # /version; /metrics is gated too — the ServiceMonitor scrapes with this token).
  warren-api-token: "REPLACE_ME"
  # Postgres DSN. Point at the in-cluster Postgres Service
  # (postgres.warren.svc:5432, deploy/k8s/components/postgres/) with no sslmode
  # flags — traffic never leaves the cluster network. Omit to fall back to SQLite
  # on the warren-data PVC (WARREN_DATA_DIR=/data).
  warren-db-url: "REPLACE_ME"
  # git push + init-container clone of private repos.
  github-token: "REPLACE_ME"
  # injected into agent pod env so the in-pod agent can call Anthropic.
  anthropic-api-key: "REPLACE_ME"
  # optional error reporting.
  sentry-dsn: ""
  # Public-instance posture (warren-851b / warren-ce9b). NOT secret values —
  # they live here so the auth flip is a Secret edit + rollout restart rather
  # than a redeploy (see deployment.yaml for the full rationale). Both are
  # optional and both fail safe when absent: no warren-auth ⇒ token mode
  # (private); the allowlist is read only in public mode, where an empty one
  # refuses the boot.
  #   warren-auth:                  "token" (default) | "public"
  #   warren-public-allowlist:  comma-separated entries, each either a bare
  #                                 OWNER ("my-org") or one REPO
  #                                 ("some-owner/some-repo"). Not URLs. Prefer
  #                                 repo entries when the owner also holds
  #                                 private repos.
  warren-auth: ""
  warren-public-allowlist: ""
---
# The init container (`workspace-init`) sources WARREN_GIT_TOKEN from THIS Secret
# via an OPTIONAL secretKeyRef in the pod spec (pod-spec.ts DEFAULT_K8S_GIT_SECRET_*).
# It MUST live in `warren-runs` (the run pods' namespace); a Secret in `warren`
# is not visible to a pod in `warren-runs`. Same value as github-token above.
# Optional: public-repo clones succeed without it.
apiVersion: v1
kind: Secret
metadata:
  name: warren-git-token
  namespace: warren-runs
  labels:
    app.kubernetes.io/name: warren
    app.kubernetes.io/component: runs
type: Opaque
stringData:
  token: "REPLACE_ME"
---
# The agent container sources OPENROUTER_API_KEY from THIS Secret via an
# OPTIONAL secretKeyRef (pod-spec.ts DEFAULT_K8S_OPENROUTER_SECRET_*), needed
# when a run's provider is `openrouter` (pi harness — e.g. the
# moonshotai/kimi-k3 project default). MUST live in `warren-runs` like the git
# token above. Optional: anthropic-only runs schedule without it.
#
#   kubectl -n warren-runs create secret generic warren-openrouter-key \
#     --from-literal=api-key=sk-or-...
apiVersion: v1
kind: Secret
metadata:
  name: warren-openrouter-key
  namespace: warren-runs
  labels:
    app.kubernetes.io/name: warren
    app.kubernetes.io/component: runs
type: Opaque
stringData:
  api-key: "REPLACE_ME"
