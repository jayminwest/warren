name: Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "CHANGELOG.md"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version-check.outputs.release }}
      version: ${{ steps.version-check.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install

      # The full gate manifest, not a hand-picked subset (warren-8b5f). This
      # job used to run 4 of the 12 gates CI enforces on every PR, so a
      # release could ship code that CI would have rejected. `check:all` IS
      # the manifest (docs/check-all-standard.md); `ui:install` comes first
      # because check:deps (knip) resolves the src/ui workspace and runs
      # before check:bundle-size builds it.
      - run: bun run ui:install
      - run: bun run check:all

      - name: Check if version is unreleased
        id: version-check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "v$LOCAL_VERSION" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$LOCAL_VERSION already exists; skipping release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
            echo "Releasing v$LOCAL_VERSION."
          fi

      - name: Verify version sync
        if: steps.version-check.outputs.release == 'true'
        run: |
          PKG_VERSION="${{ steps.version-check.outputs.version }}"
          SRC_VERSION=$(grep -oP 'const VERSION = "\K[^"]+' src/index.ts)
          if [ "$PKG_VERSION" != "$SRC_VERSION" ]; then
            echo "::error::Version mismatch! package.json=$PKG_VERSION src/index.ts=$SRC_VERSION"
            exit 1
          fi

      - name: Tag release
        if: steps.version-check.outputs.release == 'true'
        run: |
          VERSION="${{ steps.version-check.outputs.version }}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git rev-parse --verify "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists locally; skipping create"
          else
            git tag -a "v$VERSION" -m "v$VERSION"
          fi
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already on remote; skipping push"
          else
            git push origin "v$VERSION"
          fi

      # A missing `## [X.Y.Z]` section used to fall back to `--generate-notes`,
      # so an uncurated release shipped with nobody noticing (warren-8b5f).
      # The CHANGELOG is warren's only release-notes contract, and this is the
      # ONLY place it is enforced — deliberately at release time rather than
      # in PR CI, so ordinary PRs are never blocked on changelog etiquette.
      # A miss is fatal: no notes, no release.
      - name: Extract changelog notes
        if: steps.version-check.outputs.release == 'true'
        id: changelog
        env:
          VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          set -uo pipefail
          NOTES=$(awk '/^## \['"$VERSION"'\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)
          NOTES=$(echo "$NOTES" | awk 'NF{found=1} found{lines[++n]=$0} END{while(n>0 && lines[n]=="") n--; for(i=1;i<=n;i++) print lines[i]}')
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section (or it is empty). Write the release notes before bumping the version — releases are never auto-generated."
            exit 1
          fi
          echo "$NOTES" > "${RUNNER_TEMP}/release-notes.md"

      # Create the release as a DRAFT (warren-89f2). A draft is invisible to
      # non-collaborators and is excluded from `/releases/latest`, so the
      # release is never publicly visible until its container image exists.
      # The `promote` job flips it to final only after `deploy` has built and
      # pushed ghcr.io/<owner>/warren:vX.Y.Z. Before this, `deploy` was
      # `needs: release` and ran AFTER a fully published release, so a failed
      # image build (v0.12.0, v0.12.1) left a live Release + Discord announce
      # pointing at a `docker pull` tag that was never pushed.
      - name: Create GitHub release (draft)
        if: steps.version-check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; skipping"
            exit 0
          fi
          gh release create "v$VERSION" \
            --draft \
            --title "v$VERSION" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

  # Roll GKE forward for the exact released commit. We call deploy-gke.yml
  # directly (workflow_call) rather than leaning on a `release: [published]`
  # event: releases are cut with the default GITHUB_TOKEN, and GitHub
  # suppresses workflow runs triggered by GITHUB_TOKEN-created events, so a
  # release-event trigger would never fire (warren-cb81). Passing github.sha
  # pins the build + rollout to this release's commit.
  #
  # The same job also publishes the public control-plane image, so the
  # released semver rides along (warren-26be): it is what turns into the
  # `ghcr.io/<owner>/warren:vX.Y.Z` and `:X.Y` tags self-hosters pin to.
  deploy:
    needs: release
    if: needs.release.outputs.release == 'true'
    uses: ./.github/workflows/deploy-gke.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit
    with:
      sha: ${{ github.sha }}
      deploy: true
      version: ${{ needs.release.outputs.version }}

  # Publish @os-eco/warren-cli to npm (warren-58dd, superseding mx-834a3a).
  # `needs: [release, deploy]` puts this AFTER the image build, so the chain
  # stays draft release → ghcr image → npm publish → promote: an npm version
  # can never exist without its matching ghcr image. The package ships raw
  # bun-shebang TypeScript (fleet precedent: @os-eco/burrow-cli, mx-be6bc5),
  # so there is no build step — `npm publish` packs `src/` directly.
  # Idempotent: the `npm view` short-circuit no-ops when the version is
  # already on the registry, so a retried run is safe. The package name in
  # the probe is spelled out in full because a wrong name fails open
  # (mx-be6bc5).
  publish:
    needs: [release, deploy]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Publish to npm (idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          if npm view "@os-eco/warren-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "@os-eco/warren-cli@${VERSION} is already published; skipping."
            exit 0
          fi
          npm publish --provenance --access public

  # Promote the draft release to final (warren-89f2). This runs ONLY after
  # `deploy` has built and pushed the container image AND `publish` has put
  # the CLI on npm, so the ordering guarantee is: artifacts exist first,
  # public Release second. `--latest` makes this the target of
  # `/releases/latest` at the moment of promotion, never before. Idempotent:
  # re-marking an already-published release --draft=false is a no-op, so a
  # retried run is safe.
  promote:
    needs: [release, deploy, publish]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "v${VERSION}" --repo "${REPO}" --draft=false --latest
          echo "Promoted v${VERSION} to a final release."

  # Announce the release in Discord #releases. This is a sibling of `deploy`,
  # not a step inside `release`: the release is already cut and tagged by the
  # time this runs, so a Discord outage must show as its own red job rather
  # than turn a successful release red.
  #
  # It gates on `promote` (and therefore on `deploy`), so the announcement —
  # whose footer is `docker pull ghcr.io/<owner>/warren:vX.Y.Z` — only fires
  # once BOTH the image is pushed and the Release is final (warren-89f2).
  #
  # The notes are read back from the release itself (`gh release view`) rather
  # than re-parsed from CHANGELOG.md, so Discord can never disagree with what
  # GitHub published, and the post is proof the release exists.
  announce:
    needs: [release, promote]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post release notes to Discord
        env:
          # Discord channel webhook — docs/project-setup.md §6. Unlike
          # the auto-merge app credential, its absence breaks nothing in
          # the release pipeline, so a fork with no Discord server skips
          # instead of failing. A webhook present but REJECTED is fatal.
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK}" ]; then
            echo "::warning::DISCORD_RELEASES_WEBHOOK is not configured; skipping the Discord announcement (docs/project-setup.md §6)."
            exit 0
          fi
          URL="https://github.com/${REPO}/releases/tag/v${VERSION}"
          FULL=$(gh release view "v${VERSION}" --repo "${REPO}" --json body --jq .body)
          # Discord caps an embed description at 4096 characters. Truncate on
          # whole lines, never mid-character: a split UTF-8 sequence would
          # produce a payload jq cannot encode.
          NOTES=$(printf '%s\n' "${FULL}" | awk -v cap=3500 '{ n += length($0) + 1; if (n > cap) exit; print }')
          if [ "${NOTES}" != "${FULL}" ]; then
            NOTES="${NOTES}"$'\n\n'"… [read the full notes on GitHub](${URL})"
          fi
          jq -n \
            --arg title "warren v${VERSION}" \
            --arg url "${URL}" \
            --arg notes "${NOTES}" \
            --arg image "ghcr.io/${REPO}:v${VERSION}" \
            '{
              username: "warren",
              embeds: [{
                title: $title,
                url: $url,
                description: $notes,
                color: 5793266,
                footer: { text: ("docker pull " + $image) }
              }]
            }' > payload.json
          curl --fail-with-body -sS --max-time 30 --retry 3 --retry-connrefused \
            -H "Content-Type: application/json" \
            -X POST -d @payload.json "${WEBHOOK}"
          echo "Announced v${VERSION} in Discord."

  # The auto-merge app credential is a silent single point of failure
  # (warren-8b5f). GitHub suppresses workflow runs for GITHUB_TOKEN-authored
  # pushes, so auto-merge.yml must merge with a GitHub App installation token;
  # if that credential dies (key revoked, app uninstalled, secret or variable
  # deleted), PRs simply stop merging, main stops moving, and releases stop
  # happening — with no failed run anywhere to notice. This job is the
  # heartbeat: it mints a token on every release-workflow tick and turns a
  # dead credential into a red X. App private keys carry no expiry, so the
  # old AUTO_MERGE_PAT expiry countdown (retired with warren-2565) has no
  # successor — a successful mint is the whole proof.
  #
  # It deliberately does NOT gate the release: a dead credential breaks the
  # merge queue, not this release (which is cut with github.token). So it is a
  # sibling job with no `needs` edge — visible when it fails, never blocking.
  app-heartbeat:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Mint an auto-merge app token (proof the credential is alive)
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
