name: auto-merge

# Enable GitHub's auto-merge on PRs authored by the repo owner — or by
# one of the deployment's dedicated bot accounts, named by the repo
# variable AUTO_MERGE_BOT_LOGIN (unset → owner-only; a variable rather
# than a hardcoded login so forks/self-hosters name their own bot) — so
# they merge as soon as the `ci` required check passes. The variable
# accepts a comma-separated list with no spaces (warren-7d31), because
# a deployment can author run PRs under more than one identity: the
# forge GitHub App (`<app-slug>[bot]`) when the App credential opens
# the PR, and the machine account (e.g. `warren-run-bot`) when a
# run-scoped token does. Other authors' PRs
# still run CI but require a manual `gh pr merge` (or click). Squash is
# the chosen merge method — keeps main history linear, drops the
# burrow/run_xxx branch noise from agent-opened PRs.
#
# Uses a GitHub App installation token (not GITHUB_TOKEN) so that the
# resulting push to main triggers downstream workflows (CI, Release).
# GITHUB_TOKEN-authored pushes are deliberately suppressed by GitHub to
# prevent recursive loops (seed warren-a2dc). The token is minted fresh
# per run from AUTO_MERGE_APP_ID (repo variable) + AUTO_MERGE_APP_PRIVATE_KEY
# (secret), so there is no expiring PAT to rotate — the static
# AUTO_MERGE_PAT that silently died on 2026-08-07 is retired (warren-2565).
#
# Two gates run before the arm, and both fail closed: the Article IX check
# (constitution-protected paths) and the UI baseline approval check
# (warren-4780, docs/design/ui-visual-gate.md). The second refuses a PR that
# changes scripts/ui-visual/__golden__/ or the comparison machinery unless a
# human approver applied `ui-baseline-approved` to that exact baseline
# content, and disarms auto-merge when it refuses. `labeled`/`unlabeled` are
# triggers so that applying or removing the label re-judges the PR at once.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: >-
      !github.event.pull_request.draft &&
      (github.event.pull_request.user.login == github.repository_owner ||
       (vars.AUTO_MERGE_BOT_LOGIN != '' &&
        contains(format(',{0},', vars.AUTO_MERGE_BOT_LOGIN),
                 format(',{0},', github.event.pull_request.user.login)))) &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'ui-baseline-approved')
    steps:
      # Pin to the PR head SHA, not the default `refs/pull/N/merge` ref.
      # GitHub computes the merge ref asynchronously after a PR is opened,
      # so resolving it is the same race warren-7b2f is about. A head SHA
      # from the event payload is immutable and always resolvable.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # docs/CONSTITUTION.md Article IX: changes to the constitution, the
      # cron triggers, the built-in agent definitions, or this workflow
      # itself must be merged by a human — never auto-merge. This step is
      # the executable form of that article.
      - name: Article IX check (constitution-protected paths)
        id: protected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          PROTECTED='^(docs/CONSTITUTION\.md|\.warren/triggers\.yaml|src/registry/builtins/|\.github/workflows/auto-merge\.yml)'

          # warren-7b2f: the changed-file list comes from git, NOT from
          # `gh api .../pulls/:n/files`. That endpoint keys each entry
          # `filename`; only `gh pr view --json files` uses `path`. When #609
          # swapped one for the other it kept the old `-q '.[].path'`, so from
          # 2026-07-17 the list was one empty string per file, the grep below
          # matched nothing, and this gate permitted every PR it was asked to
          # judge — including #644, which changed docs/CONSTITUTION.md,
          # .warren/triggers.yaml and this workflow itself. Git needs no field
          # name and no async materialization, so that class of bug is gone.
          # Three-dot: diff against the merge base, so commits that landed on
          # the base branch after the PR opened are not counted as changes.
          if ! CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}"); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Article IX: cannot diff ${BASE_SHA}...${HEAD_SHA} — refusing auto-merge (fail closed)."
            exit 0
          fi

          COUNT=$(printf '%s\n' "$CHANGED" | grep -c . || true)
          echo "Article IX: ${COUNT} changed file(s) in ${BASE_SHA}...${HEAD_SHA}"

          # Fail closed. A pull request always changes at least one file, so an
          # empty list means the source was unreliable — never that the diff
          # was clean. The old step drew the opposite conclusion.
          if [ "$COUNT" -eq 0 ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Article IX: empty changed-file list — refusing auto-merge (fail closed)."
            exit 0
          fi

          if printf '%s\n' "$CHANGED" | grep -qE "$PROTECTED"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Article IX: protected paths changed — auto-merge will NOT be enabled:"
            printf '%s\n' "$CHANGED" | grep -E "$PROTECTED"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Article IX: no protected paths in the diff — auto-merge may be enabled."
          fi

      # warren-4780 (docs/design/ui-visual-gate.md): a PR that changes the
      # golden baselines or the files that compare against them may arm only
      # when a human approver applied `ui-baseline-approved` to the exact
      # baseline content the head now carries. The rules live in
      # scripts/ui-visual/baseline-approval.ts, unit-tested, and this step
      # runs the BASE BRANCH TIP's copy of it, never the PR's, so a PR cannot
      # rewrite the gate that judges it. Same fail-closed shape as Article IX:
      # only an explicit `hit=false` from a gate that exited 0 permits arming.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: UI baseline approval check
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # Who may approve: the repo variable, else the repository owner.
          # Never a bot login; the gate refuses a list that names one.
          APPROVERS: ${{ vars.UI_BASELINE_APPROVERS || github.repository_owner }}
          BOT_LOGINS: ${{ vars.AUTO_MERGE_BOT_LOGIN }}
        run: |
          set -uo pipefail
          GATE="$RUNNER_TEMP/baseline-approval.ts"
          export DECISION_FILE="$RUNNER_TEMP/baseline-decision"
          : > "$DECISION_FILE"
          if ! git show "origin/${BASE_REF}:scripts/ui-visual/baseline-approval.ts" > "$GATE"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "UI baselines: origin/${BASE_REF} has no gate script — refusing auto-merge (fail closed)."
            exit 0
          fi
          if bun "$GATE" gate && grep -qx 'hit=false' "$DECISION_FILE"; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
          else
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi

      # A refusal must also undo an earlier arm: a PR armed before it gained a
      # baseline change, or before its approval was removed, would otherwise
      # merge on green CI. Uses the workflow token; a failure here is loud.
      - name: Disarm auto-merge on an unapproved baseline change
        if: steps.baseline.outputs.hit != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          armed="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // empty')"
          if [ -z "$armed" ]; then
            echo "auto-merge is not armed — nothing to disarm."
            exit 0
          fi
          gh pr merge --disable-auto "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          echo "auto-merge disarmed: the baseline change has no valid human approval."

      - name: Mint app installation token
        if: steps.protected.outputs.hit == 'false' && steps.baseline.outputs.hit == 'false'
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}

      # warren-4681: two live failures (pl-882c, #783 and #784) came from this
      # step firing exactly once against GitHub's ASYNCHRONOUS mergeability
      # computation. At `opened`, and after a conflict-repair push re-triggers
      # us via `synchronize`, GitHub is mid-recompute and `gh pr merge --auto`
      # errors out with no retry — the PR stayed unarmed until a human ran it
      # by hand. Poll for a definitive mergeable state, skip CONFLICTING PRs
      # (the seeds-merge-autoheal repair push will re-trigger us), and retry
      # the arm itself.
      - name: Enable auto-merge (squash)
        if: steps.protected.outputs.hit == 'false' && steps.baseline.outputs.hit == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # Idempotent: a re-triggered run on an already-armed PR is a no-op,
          # not an error.
          if [ -n "$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // empty')" ]; then
            echo "auto-merge already armed — nothing to do."
            exit 0
          fi

          # GitHub computes mergeability asynchronously; poll briefly for a
          # definitive answer before deciding what to do.
          state=""
          for i in 1 2 3 4 5 6; do
            state="$(gh pr view "$PR_NUMBER" --json mergeable --jq .mergeable)"
            echo "poll $i: mergeable=$state"
            [ "$state" = "UNKNOWN" ] || break
            sleep 10
          done

          # A CONFLICTING PR cannot be armed yet. The conflict-repair push
          # (seeds-merge-autoheal) re-triggers this workflow via synchronize,
          # so leaving it for that run is the designed path — not a failure.
          if [ "$state" = "CONFLICTING" ]; then
            echo "PR is CONFLICTING — deferring the arm to the post-repair synchronize run."
            exit 0
          fi

          # The gates above judged HEAD_SHA. If the head moved since, the run
          # for the newer push judges it; arming here would arm unjudged code
          # (warren-4780). --match-head-commit closes the same window at the
          # API for the arm itself.
          current="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "head moved to ${current} since this run's event (${HEAD_SHA}) — the newer run decides."
            exit 0
          fi

          for attempt in 1 2 3 4 5 6; do
            if gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"; then
              echo "auto-merge armed (attempt $attempt)."
              exit 0
            fi
            echo "::warning::arm attempt $attempt failed — GitHub may still be computing mergeability; retrying in 10s."
            sleep 10
          done
          echo "::error::auto-merge could not be armed after 6 attempts."
          exit 1
