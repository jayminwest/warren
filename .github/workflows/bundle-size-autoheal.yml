name: bundle-size-autoheal

# Bounded auto-heal for the bundle-size guard. Every recent CI failure on this
# repo was `check:bundle-size` tripping by a few hundred bytes to ~2KB because an
# agent hand-edited scripts/bundle-size-budgets.json from Vite's build-log gzip
# number (which runs ~2KB cooler than the Node-zlib guard). The script-level fix
# (bounded auto-raise in `--update`) stops agents submitting wrong budgets; this
# workflow catches the residual case where an agent forgets to re-baseline at all.
#
# When CI fails on a same-repo PR branch, this rebuilds the UI and runs
# `check-bundle-size --update` WITHOUT WARREN_BUNDLE_SIZE_ALLOW_RAISE, so only
# growth within AUTO_RAISE_CAP re-baselines; a heavy new dep stays failed for a
# human. If (and only if) the budgets file actually changed, it commits the
# measured re-baseline back to the PR branch, which re-triggers CI. If the real
# failure was something else, `check:bundle-size` already passes after the build
# and the job exits without touching anything — so it never masks non-bundle
# failures and never loops (an unchanged measurement yields an unchanged budget).
#
# Uses a GitHub App installation token (not GITHUB_TOKEN) so the heal commit
# re-triggers CI; GITHUB_TOKEN-authored pushes are suppressed by GitHub to
# avoid recursion. Minted per run from AUTO_MERGE_APP_ID +
# AUTO_MERGE_APP_PRIVATE_KEY — same app as auto-merge.yml, no PAT to rotate.
# NOTE: workflow_run jobs run from the DEFAULT branch's copy of this file, so
# this only takes effect once merged to main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

# warren-ffd2: do NOT guard on `github.event.workflow_run.event ==
# 'pull_request'` here. Warren pushes agent branches directly, so a PR
# branch's CI run often carries the `push` event, and a pull_request-only
# guard silently drops the failure this workflow exists to heal (PR #656
# needed a manual re-baseline). Instead accept any failed same-repo CI run on
# a non-main branch and let the `pr-gate` step prove the branch has an open
# same-repo PR before spending a token or a checkout on it.

jobs:
  autoheal:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}

      # Only heal a branch with an open same-repo PR. A push-event CI failure
      # on a branch with no open PR is not this workflow's problem, and this
      # keeps the fork semantics intact (an open fork PR fails the head-repo
      # job-level check before we ever get here).
      - name: Require an open same-repo PR on the head branch
        id: pr-gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.repository_owner }}:${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          prs=$(gh api "repos/${GH_REPO}/pulls?head=${HEAD_REF}&state=open" --jq 'length')
          if [ "$prs" -eq 0 ]; then
            echo "No open PR for ${HEAD_BRANCH} — nothing to heal. Skipping."
            echo "has-pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-pr=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.pr-gate.outputs.has-pr == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        if: steps.pr-gate.outputs.has-pr == 'true'
        with:
          bun-version-file: .bun-version

      - if: steps.pr-gate.outputs.has-pr == 'true'
        run: bun install
      - if: steps.pr-gate.outputs.has-pr == 'true'
        run: bun run ui:install
      - if: steps.pr-gate.outputs.has-pr == 'true'
        run: bun run build:ui

      - name: Re-baseline bundle-size budgets if (and only if) that was the failure
        if: steps.pr-gate.outputs.has-pr == 'true'
        run: |
          set -euo pipefail
          if bun run check:bundle-size; then
            echo "Bundle-size guard already passes — failure was not bundle-size. Nothing to heal."
            exit 0
          fi
          echo "Bundle-size guard failing — attempting bounded re-baseline."
          bun run scripts/check-bundle-size.ts --update || true
          if git diff --quiet -- scripts/bundle-size-budgets.json; then
            echo "Overage exceeds the auto-raise cap (or nothing to write). Leaving for a human."
            exit 0
          fi
          echo "Budgets re-baselined within cap — verifying the guard now passes."
          bun run check:bundle-size
          git config user.name "factory-droid[bot]"
          git config user.email "138933559+factory-droid[bot]@users.noreply.github.com"
          git add scripts/bundle-size-budgets.json
          git commit -m "ci: auto-heal bundle-size budgets (measured re-baseline)"
          git push origin "HEAD:${HEAD_BRANCH}"
